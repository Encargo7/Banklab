<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="BankLab architecture diagram: four request lanes connect to address mapping and four per-bank arbiters and scratchpad banks">
<defs>
 <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#64748b"/></marker>
</defs>
<rect width="1000" height="440" rx="16" fill="#101c30"/>
<text x="34" y="44" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#f8fafc">BankLab · Four-lane scratchpad controller</text>
<text x="35" y="68" font-family="Arial,sans-serif" font-size="15" fill="#9fb1c7">GPU-inspired educational architecture · 64 words × 32 bits · ready/valid</text>
<text x="33" y="119" font-family="Arial,sans-serif" font-size="16" fill="#cbd5e1">Four requester lanes</text>
<g font-family="Arial,sans-serif" font-size="17" text-anchor="middle">
 <rect x="34" y="139" width="190" height="51" rx="9" fill="#1d3955" stroke="#52789c"/><text x="129" y="170" fill="#f8fafc">Lane 0</text>
 <rect x="275" y="139" width="190" height="51" rx="9" fill="#1d3955" stroke="#52789c"/><text x="370" y="170" fill="#f8fafc">Lane 1</text>
 <rect x="516" y="139" width="190" height="51" rx="9" fill="#1d3955" stroke="#52789c"/><text x="611" y="170" fill="#f8fafc">Lane 2</text>
 <rect x="757" y="139" width="190" height="51" rx="9" fill="#1d3955" stroke="#52789c"/><text x="852" y="170" fill="#f8fafc">Lane 3</text>
</g>
<g stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"><path d="M129 190 V224"/><path d="M370 190 V224"/><path d="M611 190 V224"/><path d="M852 190 V224"/></g>
<rect x="34" y="228" width="912" height="55" rx="9" fill="#145a65" stroke="#2dd4bf"/>
<text x="490" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#fff">Address mapping + request arbitration</text>
<text x="490" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#d0faf6">Linear bank bits OR fixed XOR swizzle · round-robin winner per bank</text>
<g stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"><path d="M129 283 V311"/><path d="M370 283 V311"/><path d="M611 283 V311"/><path d="M852 283 V311"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle">
 <rect x="34" y="315" width="190" height="70" rx="9" fill="#23364c" stroke="#94a3b8"/><text x="129" y="342" font-size="18" fill="#fff">Bank 0</text><text x="129" y="364" font-size="14" fill="#cbd5e1">16 × 32-bit words</text>
 <rect x="275" y="315" width="190" height="70" rx="9" fill="#23364c" stroke="#94a3b8"/><text x="370" y="342" font-size="18" fill="#fff">Bank 1</text><text x="370" y="364" font-size="14" fill="#cbd5e1">16 × 32-bit words</text>
 <rect x="516" y="315" width="190" height="70" rx="9" fill="#23364c" stroke="#94a3b8"/><text x="611" y="342" font-size="18" fill="#fff">Bank 2</text><text x="611" y="364" font-size="14" fill="#cbd5e1">16 × 32-bit words</text>
 <rect x="757" y="315" width="190" height="70" rx="9" fill="#23364c" stroke="#94a3b8"/><text x="852" y="342" font-size="18" fill="#fff">Bank 3</text><text x="852" y="364" font-size="14" fill="#cbd5e1">16 × 32-bit words</text>
</g>
<text x="490" y="417" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#9fb1c7">One operation per bank per clock cycle · each accepted request gets a clocked response</text>
</svg>
